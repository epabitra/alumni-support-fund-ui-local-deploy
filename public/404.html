<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alumni Student Support Fund</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // This script handles routing for SPAs on GitHub Pages
      // It redirects all 404 pages to index.html with the path preserved

      var pathSegmentsToKeep = 0; // Site is served from domain root (custom domain), not /repo-name/

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <noscript>
      <p>JavaScript is required for this application to work properly.</p>
      <p><a href="/">Go to Home</a></p>
    </noscript>
  </body>
</html>
